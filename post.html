<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Bài Viết - TModz Plus</title>
    <link rel="icon" href="assets/favicon.ico" sizes="32x32" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #060810; color: #f3f4f6; }
        .glass-nav {
            background: rgba(10, 14, 26, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(236, 72, 153, 0.2);
        }
        .card-custom {
            background: rgba(18, 24, 41, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-50 glass-nav">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="text-lg sm:text-xl font-extrabold tracking-wider bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 bg-clip-text text-transparent">
                TModz Plus
            </a>
            <a href="index.html#baiviet" class="text-slate-300 hover:text-pink-400 text-sm font-semibold transition">&larr; Quay lại trang chủ</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl mx-auto px-4 pt-32 pb-16 w-full">
        <div id="post-content" class="card-custom p-6 sm:p-10 rounded-3xl">
            <div class="text-center text-slate-500 py-10">Đang tải nội dung bài viết...</div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-950 py-8 text-center text-slate-500 text-sm">
        <p>&copy; 2026 TModz Plus Audition Support. All rights reserved.</p>
    </footer>

    <!-- Script Tự Động Đọc Bài Viết -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const postSlug = urlParams.get('blog');

            if (!postSlug) {
                document.getElementById('post-content').innerHTML = '<p class="text-center text-red-400">Không tìm thấy bài viết yêu cầu!</p>';
                return;
            }

            fetch('posts.json')
                .then(response => response.json())
                .then(posts => {
                    const post = posts.find(p => p.link.includes(postSlug));
                    const container = document.getElementById('post-content');

                    if (post) {
                        document.title = `${post.title} - TModz Plus`;
                        container.innerHTML = `
                            <div class="flex items-center space-x-3 mb-6">
                                <span class="bg-pink-500/10 text-pink-400 border border-pink-500/20 text-xs font-bold px-3 py-1 rounded-full">${post.category}</span>
                                <span class="text-slate-500 text-xs">${post.date}</span>
                            </div>
                            <h1 class="text-2xl sm:text-4xl font-extrabold text-white mb-6 leading-tight">${post.title}</h1>
                            <div class="border-t border-slate-800 pt-6 text-slate-300 text-base leading-relaxed space-y-4">
                                ${post.content}
                            </div>
                        `;
                    } else {
                        container.innerHTML = '<p class="text-center text-slate-400">Bài viết không tồn tại hoặc đã bị gỡ bỏ.</p>';
                    }
                })
                .catch(error => {
                    console.error('Lỗi tải bài viết:', error);
                    document.getElementById('post-content').innerHTML = '<p class="text-center text-red-400">Đã xảy ra lỗi khi tải dữ liệu bài viết.</p>';
                });
        });
    </script>
</body>
</html>
